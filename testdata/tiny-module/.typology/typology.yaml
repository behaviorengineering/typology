id: tiny
slices:
  - id: billing
    route: /billing/
    objective: Billing bounded context for fixture tests.
    owns:
      - id: billing-store
        path: internal/billing/store
        layer: domain
    surfaces:
      - id: billing-api
        kind: api
        components:
          - id: billing-http
            path: internal/billing/httpapi
    subprograms:
      - id: invoice
        ownerComponent: billing-store
        objective: Mint an invoice record from a store request.
        input: invoice request
        output: invoice record
        store:
          - internal/billing/store
        gate: auto
    actuators:
      - id: invoice-webhook
        ownerComponent: billing-http
        objective: Notify external systems when an invoice is minted.
        signals:
          - invoice.minted
        emits:
          - webhook
        gate: auto
    opRuns:
      - id: mint-invoice
        ownerComponent: billing-store
        gate: auto
        cli: billing mint-invoice
        runs: invoice
      - id: push-invoice
        ownerComponent: billing-http
        gate: auto
        cli: billing push-invoice
        actuates: invoice-webhook
    docs:
      pages:
        - kind: overview
          path: docs/develop/billing/overview.md
        - kind: components
          path: docs/develop/billing/components.md
        - kind: contracts
          path: docs/develop/billing/contracts.md
        - kind: pipelines
          path: docs/develop/billing/pipelines.md
  - id: ledger
    objective: Ledger bounded context for fixture tests.
    owns:
      - id: ledger-core
        path: internal/ledger
        layer: domain
    docs:
      pages:
        - kind: overview
          path: docs/develop/ledger/overview.md
        - kind: components
          path: docs/develop/ledger/components.md
  - id: delivery
    objective: HTTP delivery fixture that serves an embedded UI surface.
    owns:
      - id: kitchen
        path: internal/kitchen
        layer: domain
    surfaces:
      - id: delivery-ui
        kind: ui
        components:
          - id: server
            path: internal/server
sliceBindings:
  - from: billing
    to: ledger
    kind: reads
  - from: billing
    to: config
    kind: reads
  - from: ledger
    to: config
    kind: reads
  - from: delivery
    to: board
    kind: reads
  - from: delivery
    to: config
    kind: reads
libraries:
  - id: config
    purpose: Load process settings without domain knowledge
    owns:
      - id: config
        path: internal/config
        layer: domain
  - id: board
    purpose: JSON data types for board payloads with no domain logic
    owns:
      - id: board
        path: internal/board
        layer: domain
  - id: runner
    purpose: Process exec helper without product knowledge
    owns:
      - id: runner
        path: internal/runner
        layer: domain
componentBindings:
  - from: billing-http
    to: billing-store
    rule: must
  - from: billing-store
    to: ledger-core
    rule: reads
