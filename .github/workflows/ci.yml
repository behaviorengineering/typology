name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/cable-board/package-lock.json

      - name: Build cable-board dist (embed)
        run: make cable-board-dist

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
